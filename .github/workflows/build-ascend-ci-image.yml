name: Build Ascend CI image

# Builds the Ascend 950 CI container image for linux/amd64 and linux/arm64 on
# GitHub-hosted runners (arm64 uses GitHub's official `ubuntu-22.04-arm`), and
# publishes a multi-arch manifest to quay.io/celenewyear/tilelang-ascend.
#
# The image contains the CANN 9.3.0 weekly toolkit + 950 ops and TileLang's
# Python dependencies, but not TileLang itself.

on:
  workflow_dispatch:
  push:
    branches:
      - ascend-ci-image
    paths:
      - "docker/Dockerfile.ascend"
      - ".github/workflows/build-ascend-ci-image.yml"

permissions:
  contents: read

env:
  IMAGE: quay.io/celenewyear/tilelang-ascend
  TAG: cann9.3.0-weekly.20260930-ubuntu22.04-py3.12

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          docker-images: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
          logout: false

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.arch }}
          # `tags` is required even when pushing by digest: it selects the
          # repository the per-arch manifest is pushed to.
          tags: ${{ env.IMAGE }}
          file: docker/Dockerfile.ascend
          context: .
          pull: true
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: publish multi-arch manifest
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
          logout: false

      - name: Create and push the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -eux
          docker buildx imagetools create -t "${IMAGE}:${TAG}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
