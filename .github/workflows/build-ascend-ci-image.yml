name: Build Ascend CI image

# Builds one Ascend 950 CI container image for linux/amd64 and linux/arm64 on
# GitHub-hosted runners (arm64 uses GitHub's official `ubuntu-22.04-arm`) and
# publishes a multi-arch manifest to quay.io/celenewyear/tilelang-ascend.
#
# One Dockerfile per CANN release, named after the release:
#
#   docker/Dockerfile.ascend.cann9.2.0
#   docker/Dockerfile.ascend.cann9.2.1
#   docker/Dockerfile.ascend.cann9.3.0-weekly.20261021
#   docker/Dockerfile.ascend.cann9.3.0-weekly.20261028
#
# Each Dockerfile declares the repository it publishes to and the tag to publish
# as `ARG IMAGE` / `ARG TAG`, and this workflow reads them from the file, so a
# dispatch only has to name the Dockerfile:
#
#   curl -X POST \
#     -H "Authorization: Bearer $GITHUB_TOKEN" \
#     -H "Accept: application/vnd.github+json" \
#     https://api.github.com/repos/CeleNewYear/tilelang/actions/workflows/build-ascend-ci-image.yml/dispatches \
#     -d '{"ref":"ascend-ci-image","inputs":{"dockerfile":"docker/Dockerfile.ascend.cann9.2.1"}}'

on:
  workflow_dispatch:
    inputs:
      dockerfile:
        description: Dockerfile to build.
        type: string
        required: false
        default: docker/Dockerfile.ascend.cann9.3.0-weekly.20261028

permissions:
  contents: read

jobs:
  prepare:
    name: resolve image and tag
    runs-on: ubuntu-22.04
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      file: ${{ steps.meta.outputs.file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read image and tag from the Dockerfile
        id: meta
        run: |
          set -euo pipefail
          file="${{ inputs.dockerfile || 'docker/Dockerfile.ascend.cann9.3.0-weekly.20261028' }}"
          test -f "$file"
          image="$(sed -n 's/^ARG IMAGE=//p' "$file" | head -n1 | tr -d '\r')"
          tag="$(sed -n 's/^ARG TAG=//p' "$file" | head -n1 | tr -d '\r')"
          test -n "$image"
          test -n "$tag"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'file=%s\n' "$file" >> "$GITHUB_OUTPUT"
          {
            echo "### Building \`$image:$tag\`"
            echo
            echo "Dockerfile: \`$file\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          docker-images: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
          logout: false

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.arch }}
          # `tags` is required even when pushing by digest: it selects the
          # repository the per-arch manifest is pushed to.
          tags: ${{ needs.prepare.outputs.image }}
          file: ${{ needs.prepare.outputs.file }}
          context: .
          pull: true
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: publish multi-arch manifest
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
          logout: false

      - name: Create and push the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eux
          docker buildx imagetools create -t "${IMAGE}:${TAG}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
